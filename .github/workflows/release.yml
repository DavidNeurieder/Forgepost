name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: sqlite-bundled

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (unit, integration, demo)
        run: cargo test --workspace

  build:
    name: build-release-binary
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      asset: ${{ steps.package.outputs.asset }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: sqlite-bundled

      - name: Build release binary
        run: cargo build --release --bin forgepost

      - name: Package archive
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="forgepost-v${version}-x86_64-linux.tar.gz"
          tar -C target/release -czf "${asset}" forgepost
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: forgepost-v*.tar.gz

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Build release notes
        run: |
          {
            echo "## Forgepost ${GITHUB_REF_NAME}"
            echo ""
            awk 'BEGIN{c=0} /^## \[0\./ {c++; if(c==2) exit} c==1 {print}' CHANGELOG.md
          } > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: forgepost-v*.tar.gz
          body_path: RELEASE_NOTES.md
          generate_release_notes: false