{% extends "base.html" %}
{% block title %}Settings · {{ site_name }}{% endblock %}
{% block content %}
<h1>Settings</h1>
<form method="post" action="/admin/settings">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <field>
    <label for="name">Blog name</label>
    <input id="name" name="name" type="text" maxlength="80" value="{{ site_name }}">
  </field>
  <field>
    <label for="theme">Theme</label>
    <select id="theme" name="theme">
      {% for t in themes %}
      <option value="{{ t.value }}"{% if t.selected %} selected{% endif %}>{{ t.label }}</option>
      {% endfor %}
    </select>
  </field>
  <field>
    <label for="url">Site URL</label>
    <input id="url" name="url" type="url" placeholder="https://example.com" value="{{ site_url }}">
    <p class="muted" style="margin:0.25rem 0 0;">Used for canonical links, Open Graph, sitemap, robots, and RSS.</p>
  </field>
  <field>
    <label for="tagline">Tagline</label>
    <input id="tagline" name="tagline" type="text" maxlength="200" placeholder="A short description of this blog" value="{{ tagline }}">
  </field>
  {% if !error.is_empty() %}<p class="error">{{ error }}</p>{% endif %}
  <button type="submit">Save settings</button>
</form>
{% endblock %}
