{% extends "base.html" %}
{% block title %}Editor · {{ site_name }}{% endblock %}
{% block content %}
<h1>Editor</h1>
<p class="muted">Status: <span class="badge {{ status }}">{{ status }}</span></p>
<form method="post" action="/admin/editor/{{ id }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <field>
    <label for="title">Title</label>
    <input id="title" name="title" value="{{ title }}">
  </field>
  <field>
    <label for="tags">Tags (comma separated)</label>
    <input id="tags" name="tags" value="{{ tags }}" placeholder="tech, blog">
  </field>
  <field>
    <label for="markdown">Markdown</label>
    <textarea id="markdown" name="markdown" rows="16">{{ markdown }}</textarea>
  </field>
  <div class="form-row">
    <button type="button" id="upload-image" class="secondary">Upload image</button>
    <input type="file" id="media-input" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    <button type="submit">Save</button>
    {% if status != "published" %}
    <button type="submit" formaction="/admin/editor/{{ id }}/publish" name="publish" value="1">Publish</button>
    {% else %}
    <a class="button secondary" href="/articles/{{ slug }}">View post</a>
    {% endif %}
    <a class="button secondary" href="/admin">Back to dashboard</a>
  </div>
</form>

<form method="post" action="/admin/editor/{{ id }}/delete" class="inline"
  onsubmit="return confirm('Delete this post permanently? This cannot be undone.');">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button type="submit" class="danger">Delete post</button>
</form>

<h2>Preview</h2>
<p class="muted" id="preview-status">Start typing to preview the rendered post.</p>
<div class="notice article-body" id="preview-body"></div>
<script>
(function () {
	var textarea = document.getElementById('markdown');
	var status = document.getElementById('preview-status');
	var body = document.getElementById('preview-body');
	var timer = null;
	textarea.addEventListener('input', function () {
		clearTimeout(timer);
		timer = setTimeout(function () {
			var md = textarea.value;
			if (!md.trim()) {
				body.innerHTML = '';
				status.textContent = 'Start typing to preview the rendered post.';
				return;
			}
			fetch('/api/render', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ markdown: md })
			})
				.then(function (r) { return r.json(); })
				.then(function (data) {
					body.innerHTML = data.html;
					status.textContent = 'Live preview';
				})
				.catch(function () { status.textContent = 'Preview failed.'; });
		}, 400);
	});

	var uploadBtn = document.getElementById('upload-image');
	var mediaInput = document.getElementById('media-input');
	var csrf = document.querySelector('input[name="csrf_token"]').value;

	uploadBtn.addEventListener('click', function (e) {
		e.preventDefault();
		mediaInput.click();
	});

	function insertAtCursor(text) {
		var before = textarea.value.slice(0, textarea.selectionStart);
		var after = textarea.value.slice(textarea.selectionEnd);
		var prefix = before && before.charAt(before.length - 1) !== '\n' ? '\n' : '';
		var suffix = after && after.charAt(0) !== '\n' ? '\n' : '';
		var pos = textarea.selectionStart + prefix.length;
		textarea.value = before + prefix + text + suffix + after;
		textarea.setSelectionRange(pos, pos + text.length);
		textarea.focus();
	}

	mediaInput.addEventListener('change', function () {
		var file = mediaInput.files && mediaInput.files[0];
		if (!file) { return; }
		var formData = new FormData();
		formData.append('data', file);
		status.textContent = 'Uploading image…';
		fetch('/admin/media', {
			method: 'POST',
			headers: { 'x-csrf-token': csrf },
			body: formData
		})
			.then(function (r) {
				if (!r.ok) { throw new Error('upload failed'); }
				return r.json();
			})
			.then(function (data) {
				insertAtCursor('![alt](' + data.url + ')');
				status.textContent = 'Image uploaded.';
				textarea.dispatchEvent(new Event('input'));
			})
			.catch(function () { status.textContent = 'Upload failed.'; })
			.finally(function () { mediaInput.value = ''; });
	});
})();
</script>
{% endblock %}
