{% extends "base.html" %}
{% block title %}Editor · OpenPublish{% endblock %}
{% block content %}
<h1>Editor</h1>
<p class="muted">Status: <span class="badge {{ status }}">{{ status }}</span></p>
<form method="post" action="/admin/editor/{{ id }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <field>
    <label for="title">Title</label>
    <input id="title" name="title" value="{{ title }}">
  </field>
  <field>
    <label for="tags">Tags (comma separated)</label>
    <input id="tags" name="tags" value="{{ tags }}" placeholder="tech, blog">
  </field>
  <field>
    <label for="markdown">Markdown</label>
    <textarea id="markdown" name="markdown" rows="16">{{ markdown }}</textarea>
  </field>
  <div class="form-row">
    <button type="submit">Save</button>
    {% if status != "published" %}
    <button type="submit" formaction="/admin/editor/{{ id }}/publish" name="publish" value="1">Publish</button>
    {% else %}
    <a class="button secondary" href="/articles/{{ slug }}">View post</a>
    {% endif %}
    <a class="button secondary" href="/admin">Back to dashboard</a>
  </div>
</form>

<h2>Preview</h2>
<p class="muted" id="preview-status">Start typing to preview the rendered post.</p>
<div class="notice article-body" id="preview-body"></div>
<script>
(function () {
	var textarea = document.getElementById('markdown');
	var status = document.getElementById('preview-status');
	var body = document.getElementById('preview-body');
	var timer = null;
	textarea.addEventListener('input', function () {
		clearTimeout(timer);
		timer = setTimeout(function () {
			var md = textarea.value;
			if (!md.trim()) {
				body.innerHTML = '';
				status.textContent = 'Start typing to preview the rendered post.';
				return;
			}
			fetch('/api/render', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ markdown: md })
			})
				.then(function (r) { return r.json(); })
				.then(function (data) {
					body.innerHTML = data.html;
					status.textContent = 'Live preview';
				})
				.catch(function () { status.textContent = 'Preview failed.'; });
		}, 400);
	});
})();
</script>
{% endblock %}
