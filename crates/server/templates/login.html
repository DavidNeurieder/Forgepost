{% extends "base.html" %}
{% block title %}Log in · {{ site_name }}{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" action="/login">
  <field>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email">
  </field>
  <field>
    <label for="password">Password</label>
    <span class="password-field">
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="button" class="toggle-password" aria-controls="password" aria-label="Show password" aria-pressed="false">
        <svg class="eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
          <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
          <path d="M1 1l22 22"></path>
        </svg>
      </button>
    </span>
  </field>
  {% if !error.is_empty() %}<p class="error">{{ error }}</p>{% endif %}
  <button type="submit">Log in</button>
</form>
<script>
(function () {
	var toggles = document.querySelectorAll('.toggle-password');
	toggles.forEach(function (button) {
		button.addEventListener('click', function () {
			var input = document.getElementById(button.getAttribute('aria-controls'));
			if (!input) { return; }
			var show = input.type === 'password';
			input.type = show ? 'text' : 'password';
			button.setAttribute('aria-pressed', String(show));
			button.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
		});
	});
})();
</script>
{% endblock %}
