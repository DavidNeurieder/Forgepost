{% extends "base.html" %}
{% block title %}Set up · {{ site_name }}{% endblock %}
{% block content %}
<h1>Welcome to {{ site_name }}</h1>
<p class="muted">Create the owner account. You will be the only administrator of this blog.</p>
<form method="post" action="/setup">
  <field>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email">
  </field>
  <field>
    <label for="display">Display name</label>
    <input id="display" name="display" autocomplete="name">
  </field>
  <field>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password">
  </field>
  <field>
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password">
  </field>
  {% if !error.is_empty() %}<p class="error">{{ error }}</p>{% endif %}
  <button type="submit">Create account</button>
</form>
{% endblock %}
